name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # A fresh, disposable Postgres container per run -- never production.
      # See tests/conftest.py for why this must be set before any test
      # module imports app.Core.db.database.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      CGC_APP_ROLE_PASSWORD: ci-test-only-password-not-a-real-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        # python -m pytest, not bare `pytest` -- the -m form prepends the
        # current working directory (the repo root) to sys.path, which is
        # what makes `from app...` importable. The bare `pytest` entry
        # point relies on pytest's own file-relative rootdir insertion
        # instead, which (with no tests/__init__.py) inserts tests/ itself,
        # not the repo root -- ModuleNotFoundError: No module named 'app'
        # on every collection, every time, found live reproducing this
        # exact CI environment (Linux, Python 3.12) in Docker after two
        # real CI failures.
        run: python -m pytest -v
