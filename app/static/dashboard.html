<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CGC Core — Monitoring</title>
<style>
  :root {
    --bg: #0b0f0e;
    --panel: #121816;
    --panel-2: #171f1c;
    --border: #253430;
    --text: #e6efe9;
    --muted: #7d9089;
    --accent: #4fd8a8;
    --accent-dim: rgba(79,216,168,0.12);
    --red: #ea8a78;
    --red-bg: rgba(234,138,120,0.12);
    --amber: #e8b454;
    --amber-bg: rgba(232,180,84,0.12);
    --green: #4ed892;
    --green-bg: rgba(78,216,146,0.12);
    --mono: ui-monospace, "SF Mono", Consolas, monospace;
    --sans: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--sans); font-size: 14px; line-height: 1.5;
  }
  #gate {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 16px; padding: 24px;
  }
  #gate .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 28px; width: 100%; max-width: 380px;
  }
  #gate h1 { font-size: 16px; margin: 0 0 4px; letter-spacing: 0.02em; }
  #gate p { color: var(--muted); font-size: 12.5px; margin: 0 0 18px; }
  #gate input {
    width: 100%; background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 6px; padding: 9px 10px; color: var(--text); font-family: var(--mono);
    font-size: 12.5px; margin-bottom: 10px;
  }
  #gate button, .btn {
    background: var(--accent); color: #04140e; border: none; border-radius: 6px;
    padding: 9px 14px; font-weight: 700; font-size: 12.5px; cursor: pointer; width: 100%;
  }
  #gate .err { color: var(--red); font-size: 12px; margin-top: 8px; min-height: 16px; }
  #app { display: none; max-width: 1160px; margin: 0 auto; padding: 28px 20px 60px; }
  header.top {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px;
  }
  header.top h1 { font-size: 15px; margin: 0; letter-spacing: 0.02em; }
  header.top .sub { color: var(--muted); font-size: 11.5px; font-family: var(--mono); }
  header.top .right { display: flex; align-items: center; gap: 10px; }
  #dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); display: inline-block; }
  .logout { background: none; border: 1px solid var(--border); color: var(--muted); padding: 5px 10px; border-radius: 6px; font-size: 11px; cursor: pointer; }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px,1fr)); gap: 12px; margin-bottom: 22px; }
  .cards .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .cards .card .n { font-family: var(--mono); font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .cards .card .l { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 2px; }

  section { margin-bottom: 24px; }
  section h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 10px; }

  .modgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px,1fr)); gap: 8px; }
  .mod { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; display: flex; align-items: center; gap: 8px; }
  .mod .m-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
  .mod .m-dot.off { background: var(--red); }
  .mod .m-name { font-family: var(--mono); font-size: 11.5px; }

  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .tablewrap { overflow-x: auto; border-radius: 10px; border: 1px solid var(--border); }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--border); font-size: 12.5px; white-space: nowrap; }
  th { color: var(--muted); text-transform: uppercase; font-size: 10.5px; letter-spacing: 0.04em; background: var(--panel-2); }
  td.msg { white-space: normal; max-width: 420px; font-family: var(--mono); font-size: 12px; }
  tr:last-child td { border-bottom: none; }
  .pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 100px; font-size: 10.5px; font-weight: 700; }
  .pill::before { content: ""; width: 5px; height: 5px; border-radius: 50%; }
  .pill.error, .pill.critical { background: var(--red-bg); color: var(--red); }
  .pill.error::before, .pill.critical::before { background: var(--red); }
  .pill.warning { background: var(--amber-bg); color: var(--amber); }
  .pill.warning::before { background: var(--amber); }
  .pill.info { background: var(--green-bg); color: var(--green); }
  .pill.info::before { background: var(--green); }
  .resolve-btn { background: none; border: 1px solid var(--border); color: var(--muted); padding: 4px 9px; border-radius: 5px; font-size: 10.5px; cursor: pointer; }
  .resolve-btn:hover { color: var(--accent); border-color: var(--accent); }
  .resolved-tag { color: var(--muted); font-size: 10.5px; }
  .empty { color: var(--muted); font-size: 12.5px; padding: 20px; text-align: center; }
</style>
</head>
<body>

<div id="gate">
  <div class="card">
    <h1>CGC Core — Monitoring</h1>
    <p>Pega tu Bearer token para conectar. Se guarda solo en este navegador.</p>
    <input id="keyInput" type="password" placeholder="CGC_SERVICE_API_KEY o token" autocomplete="off">
    <button onclick="connect()">Conectar</button>
    <div class="err" id="gateErr"></div>
  </div>
</div>

<div id="app">
  <header class="top">
    <div>
      <h1>CGC Core — Monitoring Systems</h1>
      <div class="sub">cgc-cre.vercel.app</div>
    </div>
    <div class="right">
      <span id="dot"></span>
      <span class="sub" id="lastRefresh">—</span>
      <button class="logout" onclick="disconnect()">Desconectar</button>
    </div>
  </header>

  <div class="cards" id="statCards"></div>

  <section>
    <h2>Módulos de gobernanza</h2>
    <div class="modgrid" id="modGrid"></div>
  </section>

  <section>
    <h2>Errores recientes</h2>
    <div class="tablewrap">
      <table id="errTable">
        <thead>
          <tr><th>App</th><th>Severidad</th><th>Mensaje</th><th>Veces</th><th>Última vez</th><th></th></tr>
        </thead>
        <tbody id="errBody"></tbody>
      </table>
    </div>
  </section>
</div>

<script>
const API = window.location.origin;
let TOKEN = localStorage.getItem('cgc_dash_token') || '';
let timer = null;

function connect() {
  const v = document.getElementById('keyInput').value.trim();
  if (!v) return;
  TOKEN = v;
  localStorage.setItem('cgc_dash_token', v);
  boot();
}
function disconnect() {
  localStorage.removeItem('cgc_dash_token');
  TOKEN = '';
  if (timer) clearInterval(timer);
  document.getElementById('app').style.display = 'none';
  document.getElementById('gate').style.display = 'flex';
}

async function api(path) {
  const r = await fetch(API + path, { headers: { 'Authorization': 'Bearer ' + TOKEN } });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function refresh() {
  try {
    const [stats, errs, nodes] = await Promise.all([
      api('/monitor/errors/stats?days=7'),
      api('/monitor/errors?limit=50'),
      api('/status/nodes'),
    ]);
    document.getElementById('dot').style.background = 'var(--green)';
    document.getElementById('gateErr').textContent = '';

    document.getElementById('statCards').innerHTML = `
      <div class="card"><div class="n">${stats.total_reports}</div><div class="l">Errores únicos (7d)</div></div>
      <div class="card"><div class="n">${stats.total_occurrences}</div><div class="l">Ocurrencias totales</div></div>
      <div class="card"><div class="n">${stats.unresolved}</div><div class="l">Sin resolver</div></div>
      <div class="card"><div class="n">${(stats.by_app_source && stats.by_app_source.ledgiproof) || 0}</div><div class="l">LedgiProof</div></div>
      <div class="card"><div class="n">${(stats.by_app_source && stats.by_app_source['ledgiproof-tax-pro']) || 0}</div><div class="l">Tax Pro</div></div>
    `;

    const mods = nodes.nodes || {};
    document.getElementById('modGrid').innerHTML = Object.keys(mods).map(k => {
      const active = mods[k] && (mods[k].status === 'active' || mods[k].status === 'ACTIVE' || mods[k].total_evaluations !== undefined);
      return `<div class="mod"><span class="m-dot ${active ? '' : 'off'}"></span><span class="m-name">${esc(k)}</span></div>`;
    }).join('') || '<div class="empty">Sin datos de módulos</div>';

    const rows = errs.reports || [];
    document.getElementById('errBody').innerHTML = rows.length ? rows.map(r => `
      <tr>
        <td>${esc(r.app_source)}</td>
        <td><span class="pill ${esc(r.severity)}">${esc(r.severity)}</span></td>
        <td class="msg">${esc((r.message || '').slice(0, 140))}</td>
        <td>${esc(r.count)}</td>
        <td>${esc((r.last_seen || '').slice(0, 19).replace('T', ' '))}</td>
        <td>${r.resolved ? '<span class="resolved-tag">resuelto</span>' : `<button class="resolve-btn" onclick="resolveErr('${esc(r.fingerprint)}')">Resolver</button>`}</td>
      </tr>
    `).join('') : `<tr><td colspan="6" class="empty">Sin errores reportados</td></tr>`;

    document.getElementById('lastRefresh').textContent = 'actualizado ' + new Date().toLocaleTimeString();
  } catch (e) {
    document.getElementById('dot').style.background = 'var(--red)';
    document.getElementById('lastRefresh').textContent = 'error: ' + e.message;
  }
}

async function resolveErr(fp) {
  try {
    await fetch(API + '/monitor/errors/' + fp + '/resolve', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + TOKEN }
    });
    refresh();
  } catch (e) {}
}

async function boot() {
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  try {
    await api('/monitor/errors/stats?days=1');
  } catch (e) {
    document.getElementById('app').style.display = 'none';
    document.getElementById('gate').style.display = 'flex';
    document.getElementById('gateErr').textContent = 'Token inválido o sin conexión.';
    return;
  }
  refresh();
  timer = setInterval(refresh, 30000);
}

if (TOKEN) boot();
</script>
</body>
</html>
