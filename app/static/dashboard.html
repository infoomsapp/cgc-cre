<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CGC Core — Monitoring</title>
<style>
  :root {
    --bg: #0b0f0e;
    --panel: #121816;
    --panel-2: #171f1c;
    --border: #253430;
    --text: #e6efe9;
    --muted: #7d9089;
    --accent: #4fd8a8;
    --accent-dim: rgba(79,216,168,0.12);
    --red: #ea8a78;
    --red-bg: rgba(234,138,120,0.12);
    --amber: #e8b454;
    --amber-bg: rgba(232,180,84,0.12);
    --green: #4ed892;
    --green-bg: rgba(78,216,146,0.12);
    --mono: ui-monospace, "SF Mono", Consolas, monospace;
    --sans: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--sans); font-size: 14px; line-height: 1.5;
  }
  #gate {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 16px; padding: 24px;
  }
  #gate .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 28px; width: 100%; max-width: 380px;
  }
  #gate h1 { font-size: 16px; margin: 0 0 4px; letter-spacing: 0.02em; }
  #gate p { color: var(--muted); font-size: 12.5px; margin: 0 0 18px; }
  #gate input {
    width: 100%; background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 6px; padding: 9px 10px; color: var(--text); font-family: var(--mono);
    font-size: 12.5px; margin-bottom: 10px;
  }
  #gate button, .btn {
    background: var(--accent); color: #04140e; border: none; border-radius: 6px;
    padding: 9px 14px; font-weight: 700; font-size: 12.5px; cursor: pointer; width: 100%;
  }
  #gate .err { color: var(--red); font-size: 12px; margin-top: 8px; min-height: 16px; }
  #app { display: none; max-width: 1160px; margin: 0 auto; padding: 28px 20px 60px; }
  header.top {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px;
  }
  header.top h1 { font-size: 15px; margin: 0; letter-spacing: 0.02em; }
  header.top .sub { color: var(--muted); font-size: 11.5px; font-family: var(--mono); }
  header.top .right { display: flex; align-items: center; gap: 10px; }
  #dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); display: inline-block; }
  .logout { background: none; border: 1px solid var(--border); color: var(--muted); padding: 5px 10px; border-radius: 6px; font-size: 11px; cursor: pointer; }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px,1fr)); gap: 12px; margin-bottom: 22px; }
  .cards .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .cards .card .n { font-family: var(--mono); font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .cards .card .l { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 2px; }

  section { margin-bottom: 24px; }
  section h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 10px; }
  .sectionhead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .sectionhead h2 { margin: 0; }
  .bulk-delete-btn { background: var(--red-bg); color: var(--red); border: 1px solid var(--red); padding: 5px 12px; border-radius: 6px; font-size: 11px; font-weight: 700; cursor: pointer; }
  .bulk-delete-btn:disabled { opacity: 0.35; cursor: default; }
  th.checkcol, td.checkcol { width: 32px; }

  .modgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px,1fr)); gap: 8px; }
  .mod { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; display: flex; align-items: center; gap: 8px; }
  .mod .m-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
  .mod .m-dot.off { background: var(--red); }
  .mod .m-name { font-family: var(--mono); font-size: 11.5px; }

  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .tablewrap { overflow-x: auto; border-radius: 10px; border: 1px solid var(--border); }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--border); font-size: 12.5px; white-space: nowrap; }
  th { color: var(--muted); text-transform: uppercase; font-size: 10.5px; letter-spacing: 0.04em; background: var(--panel-2); }
  td.msg { white-space: normal; max-width: 420px; font-family: var(--mono); font-size: 12px; }
  tr:last-child td { border-bottom: none; }
  .pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 100px; font-size: 10.5px; font-weight: 700; }
  .pill::before { content: ""; width: 5px; height: 5px; border-radius: 50%; }
  .pill.error, .pill.critical { background: var(--red-bg); color: var(--red); }
  .pill.error::before, .pill.critical::before { background: var(--red); }
  .pill.warning { background: var(--amber-bg); color: var(--amber); }
  .pill.warning::before { background: var(--amber); }
  .pill.info { background: var(--green-bg); color: var(--green); }
  .pill.info::before { background: var(--green); }
  .resolve-btn { background: none; border: 1px solid var(--border); color: var(--muted); padding: 4px 9px; border-radius: 5px; font-size: 10.5px; cursor: pointer; }
  .resolve-btn:hover { color: var(--accent); border-color: var(--accent); }
  .resolved-tag { color: var(--muted); font-size: 10.5px; }
  .empty { color: var(--muted); font-size: 12.5px; padding: 20px; text-align: center; }

  .field { background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px; padding: 9px 10px; color: var(--text); font-family: var(--mono); font-size: 12.5px; }
  .reportControls { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 14px; }
  .reportControls .fieldGroup { display: flex; flex-direction: column; gap: 4px; }
  .reportControls label { color: var(--muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.04em; }
  .reportControls .btn { width: auto; padding: 9px 18px; }
  .reportViewerCard { display: none; padding: 0; overflow: hidden; }
  #reportViewer { width: 100%; height: 640px; border: none; display: block; }

  .flowCards { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px,1fr)); gap: 14px; }
  .flowCard { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; }
  .flowCard .flowHead { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
  .flowCard .flowApp { font-size: 12.5px; font-weight: 700; letter-spacing: 0.02em; }
  .flowCard .flowNum { font-family: var(--mono); font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--muted); }
  .flowCard .flowNum.good { color: var(--green); }
  .flowCard .flowNum.warn { color: var(--amber); }
  .flowCard .flowNum.bad { color: var(--red); }
  .flowSignals { display: flex; flex-direction: column; gap: 6px; }
  .flowSignal { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 11.5px; color: var(--muted); }
  .flowSignal .fsVal { font-family: var(--mono); color: var(--text); white-space: nowrap; }
  .flowSignal.info { opacity: 0.7; font-style: italic; }
</style>
</head>
<body>

<div id="gate">
  <div class="card">
    <h1>CGC Core — Monitoring</h1>
    <p>Paste your Bearer token to connect. Stored only in this browser.</p>
    <input id="keyInput" type="password" placeholder="CGC_SERVICE_API_KEY or token" autocomplete="off">
    <button onclick="connect()">Connect</button>
    <div class="err" id="gateErr"></div>
  </div>
</div>

<div id="app">
  <header class="top">
    <div>
      <h1>CGC Core — Monitoring Systems</h1>
      <div class="sub">cgc-cre.vercel.app</div>
    </div>
    <div class="right">
      <span id="dot"></span>
      <span class="sub" id="lastRefresh">—</span>
      <button class="logout" onclick="disconnect()">Disconnect</button>
    </div>
  </header>

  <div class="cards" id="statCards"></div>

  <section>
    <h2>Governance Modules</h2>
    <div class="modgrid" id="modGrid"></div>
  </section>

  <section>
    <h2>Business Flow Scoring</h2>
    <div class="flowCards" id="flowCards"></div>
  </section>

  <section>
    <div class="sectionhead">
      <h2>Recent Errors</h2>
      <button class="bulk-delete-btn" id="bulkDeleteBtn" onclick="bulkDeleteSelected()" disabled>Delete Selected (0)</button>
    </div>
    <div class="tablewrap">
      <table id="errTable">
        <thead>
          <tr><th class="checkcol"><input type="checkbox" id="selectAll" onchange="toggleSelectAll(this)"></th><th>App</th><th>Severity</th><th>Message</th><th>Count</th><th>Last Seen</th><th></th></tr>
        </thead>
        <tbody id="errBody"></tbody>
      </table>
    </div>
  </section>

  <section>
    <h2>Governance Reports</h2>
    <div class="reportControls">
      <div class="fieldGroup">
        <label for="reportAppSource">App</label>
        <select id="reportAppSource" class="field">
          <option value="ledgiproof">LedgiProof</option>
          <option value="ledgiproof-tax-pro">LedgiProof Tax Pro</option>
        </select>
      </div>
      <div class="fieldGroup">
        <label for="reportFrom">From</label>
        <input type="date" id="reportFrom" class="field">
      </div>
      <div class="fieldGroup">
        <label for="reportTo">To</label>
        <input type="date" id="reportTo" class="field">
      </div>
      <button class="btn" onclick="generateReport()">Generate Report</button>
    </div>
    <div class="card reportViewerCard" id="reportViewerCard">
      <iframe id="reportViewer"></iframe>
    </div>
  </section>
</div>

<script>
const API = window.location.origin;
let TOKEN = localStorage.getItem('cgc_dash_token') || '';
let timer = null;
let selected = new Set();

function connect() {
  const v = document.getElementById('keyInput').value.trim();
  if (!v) return;
  TOKEN = v;
  localStorage.setItem('cgc_dash_token', v);
  boot();
}
function disconnect() {
  localStorage.removeItem('cgc_dash_token');
  TOKEN = '';
  if (timer) clearInterval(timer);
  document.getElementById('app').style.display = 'none';
  document.getElementById('gate').style.display = 'flex';
}

async function api(path) {
  const r = await fetch(API + path, { headers: { 'Authorization': 'Bearer ' + TOKEN } });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function fmtPct(x) {
  return (x === null || x === undefined) ? '—' : (x * 100).toFixed(1) + '%';
}

function scoreClass(score) {
  if (score === null || score === undefined) return '';
  if (score >= 80) return 'good';
  if (score >= 60) return 'warn';
  return 'bad';
}

function renderFlowCard(appLabel, data) {
  if (!data || data.insufficient_data) {
    const have = data ? data.sample_sizes.baseline_total : 0;
    return `
      <div class="flowCard">
        <div class="flowHead"><span class="flowApp">${esc(appLabel)}</span><span class="flowNum">—</span></div>
        <div class="empty" style="padding:8px 0;">Not enough decision history yet (${esc(have)}/10 baseline decisions)</div>
      </div>`;
  }
  const s = data.signals;
  return `
    <div class="flowCard">
      <div class="flowHead">
        <span class="flowApp">${esc(appLabel)}</span>
        <span class="flowNum ${scoreClass(data.flow_score)}">${esc(data.flow_score)}</span>
      </div>
      <div class="flowSignals">
        <div class="flowSignal"><span>Approval rate</span><span class="fsVal">${fmtPct(s.approval_drift.current_rate)} (was ${fmtPct(s.approval_drift.baseline_rate)})</span></div>
        <div class="flowSignal"><span>Velocity</span><span class="fsVal">${esc(s.velocity_spike.current_per_day)}/day (was ${esc(s.velocity_spike.baseline_per_day)}/day)</span></div>
        <div class="flowSignal"><span>High-sensitivity share</span><span class="fsVal">${fmtPct(s.sensitivity_creep.current_rate)} (was ${fmtPct(s.sensitivity_creep.baseline_rate)})</span></div>
        <div class="flowSignal info"><span>Human-review load</span><span class="fsVal">${fmtPct(s.human_review_load.current_rate)} (was ${fmtPct(s.human_review_load.baseline_rate)})</span></div>
      </div>
    </div>`;
}

async function refresh() {
  try {
    const [stats, errs, nodes, flowLp, flowLtp] = await Promise.all([
      api('/monitor/errors/stats?days=7'),
      api('/monitor/errors?limit=50'),
      api('/status/nodes'),
      api('/flow-score/ledgiproof'),
      api('/flow-score/ledgiproof-tax-pro'),
    ]);

    document.getElementById('flowCards').innerHTML =
      renderFlowCard('LedgiProof', flowLp) + renderFlowCard('LedgiProof Tax Pro', flowLtp);
    document.getElementById('dot').style.background = 'var(--green)';
    document.getElementById('gateErr').textContent = '';

    document.getElementById('statCards').innerHTML = `
      <div class="card"><div class="n">${stats.total_reports}</div><div class="l">Unique Errors (7d)</div></div>
      <div class="card"><div class="n">${stats.total_occurrences}</div><div class="l">Total Occurrences</div></div>
      <div class="card"><div class="n">${stats.unresolved}</div><div class="l">Unresolved</div></div>
      <div class="card"><div class="n">${(stats.by_app_source && stats.by_app_source.ledgiproof) || 0}</div><div class="l">LedgiProof</div></div>
      <div class="card"><div class="n">${(stats.by_app_source && stats.by_app_source['ledgiproof-tax-pro']) || 0}</div><div class="l">Tax Pro</div></div>
    `;

    const mods = nodes.nodes || {};
    document.getElementById('modGrid').innerHTML = Object.keys(mods).map(k => {
      const active = mods[k] && (mods[k].status === 'active' || mods[k].status === 'ACTIVE' || mods[k].total_evaluations !== undefined);
      return `<div class="mod"><span class="m-dot ${active ? '' : 'off'}"></span><span class="m-name">${esc(k)}</span></div>`;
    }).join('') || '<div class="empty">No module data</div>';

    selected = new Set([...selected].filter(fp => (errs.reports || []).some(r => r.fingerprint === fp)));
    const rows = errs.reports || [];
    document.getElementById('errBody').innerHTML = rows.length ? rows.map(r => `
      <tr>
        <td class="checkcol"><input type="checkbox" data-fp="${esc(r.fingerprint)}" onchange="toggleRow('${esc(r.fingerprint)}', this.checked)" ${selected.has(r.fingerprint) ? 'checked' : ''}></td>
        <td>${esc(r.app_source)}</td>
        <td><span class="pill ${esc(r.severity)}">${esc(r.severity)}</span></td>
        <td class="msg">${esc((r.message || '').slice(0, 140))}</td>
        <td>${esc(r.count)}</td>
        <td>${esc((r.last_seen || '').slice(0, 19).replace('T', ' '))}</td>
        <td>
          ${r.resolved ? '<span class="resolved-tag">resolved</span>' : `<button class="resolve-btn" onclick="resolveErr('${esc(r.fingerprint)}')">Resolve</button>`}
          <button class="resolve-btn" onclick="deleteErr('${esc(r.fingerprint)}')">Delete</button>
        </td>
      </tr>
    `).join('') : `<tr><td colspan="7" class="empty">No errors reported</td></tr>`;
    document.getElementById('selectAll').checked = rows.length > 0 && selected.size === rows.length;
    updateBulkBtn();

    document.getElementById('lastRefresh').textContent = 'updated ' + new Date().toLocaleTimeString();
  } catch (e) {
    document.getElementById('dot').style.background = 'var(--red)';
    document.getElementById('lastRefresh').textContent = 'error: ' + e.message;
  }
}

async function resolveErr(fp) {
  try {
    await fetch(API + '/monitor/errors/' + fp + '/resolve', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + TOKEN }
    });
    refresh();
  } catch (e) {}
}

async function deleteErr(fp) {
  if (!confirm('Permanently delete this error report?')) return;
  try {
    await fetch(API + '/monitor/errors/' + fp, {
      method: 'DELETE',
      headers: { 'Authorization': 'Bearer ' + TOKEN }
    });
    refresh();
  } catch (e) {}
}

function toggleRow(fp, checked) {
  if (checked) selected.add(fp); else selected.delete(fp);
  const all = document.querySelectorAll('#errBody input[type=checkbox]');
  document.getElementById('selectAll').checked = all.length > 0 && selected.size === all.length;
  updateBulkBtn();
}

function toggleSelectAll(checkbox) {
  document.querySelectorAll('#errBody input[type=checkbox]').forEach(cb => {
    cb.checked = checkbox.checked;
    if (checkbox.checked) selected.add(cb.dataset.fp); else selected.delete(cb.dataset.fp);
  });
  updateBulkBtn();
}

function updateBulkBtn() {
  const btn = document.getElementById('bulkDeleteBtn');
  btn.textContent = `Delete Selected (${selected.size})`;
  btn.disabled = selected.size === 0;
}

async function bulkDeleteSelected() {
  const fingerprints = [...selected];
  if (!fingerprints.length) return;
  if (!confirm(`Permanently delete ${fingerprints.length} error report(s)?`)) return;
  try {
    await fetch(API + '/monitor/errors/bulk-delete', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + TOKEN, 'Content-Type': 'application/json' },
      body: JSON.stringify({ fingerprints })
    });
    selected.clear();
    refresh();
  } catch (e) {}
}

function initReportDates() {
  const to = new Date();
  const from = new Date();
  from.setDate(from.getDate() - 30);
  document.getElementById('reportTo').value = to.toISOString().slice(0, 10);
  document.getElementById('reportFrom').value = from.toISOString().slice(0, 10);
}

async function generateReport() {
  const appSource = document.getElementById('reportAppSource').value;
  const from = document.getElementById('reportFrom').value;
  const to = document.getElementById('reportTo').value;
  try {
    const r = await fetch(`${API}/governance/reports/${appSource}?from_date=${from}&to_date=${to}`, {
      headers: { 'Authorization': 'Bearer ' + TOKEN }
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    document.getElementById('reportViewer').src = url;
    document.getElementById('reportViewerCard').style.display = 'block';
  } catch (e) {
    alert('Report generation failed: ' + e.message);
  }
}

async function boot() {
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  try {
    await api('/monitor/errors/stats?days=1');
  } catch (e) {
    document.getElementById('app').style.display = 'none';
    document.getElementById('gate').style.display = 'flex';
    document.getElementById('gateErr').textContent = 'Invalid token or connection failed.';
    return;
  }
  initReportDates();
  refresh();
  timer = setInterval(refresh, 30000);
}

if (TOKEN) boot();
</script>
</body>
</html>
