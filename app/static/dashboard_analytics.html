<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CGC Core — Analytics</title>
<link rel="icon" type="image/png" sizes="32x32" href="/static/img/cgc_favicon_32.png">
<link rel="icon" type="image/png" sizes="64x64" href="/static/img/cgc_favicon_64.png">
<link rel="apple-touch-icon" sizes="180x180" href="/static/img/cgc_favicon_180.png">
<style>
  :root {
    --bg: #0b0f0e;
    --panel: #121816;
    --panel-2: #171f1c;
    --border: #253430;
    --text: #e6efe9;
    --muted: #7d9089;
    --accent: #4fd8a8;
    --accent-dim: rgba(79,216,168,0.12);
    --red: #ea8a78;
    --amber: #e8b454;
    --green: #4ed892;
    --green-bg: rgba(78,216,146,0.12);
    --mono: ui-monospace, "SF Mono", Consolas, monospace;
    --sans: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--sans); font-size: 14px; line-height: 1.5;
  }
  #gate {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 60px; padding: 24px;
  }
  #gate .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 40px 36px; width: 100%; max-width: 400px;
  }
  #gate h1 { font-size: 16px; margin: 0 0 4px; letter-spacing: 0.02em; }
  #gate p { color: var(--muted); font-size: 12.5px; margin: 0 0 18px; }
  #gate input {
    width: 100%; background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 6px; padding: 9px 10px; color: var(--text); font-family: var(--mono);
    font-size: 12.5px; margin-bottom: 10px;
  }
  #gate button, .btn {
    background: var(--accent); color: #04140e; border: none; border-radius: 6px;
    padding: 9px 14px; font-weight: 700; font-size: 12.5px; cursor: pointer; width: 100%;
  }
  #gate .err { color: var(--red); font-size: 12px; margin-top: 8px; min-height: 16px; }
  #gate form { display: flex; flex-direction: column; gap: 10px; }
  #gate .divider { display: flex; align-items: center; gap: 10px; margin: 16px 0 10px; color: var(--muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; }
  #gate .divider::before, #gate .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  #gate .linkBtn { background: none; border: none; color: var(--muted); font-size: 11.5px; cursor: pointer; padding: 0; width: auto; font-weight: 600; text-decoration: underline; }
  #gate .linkBtn:hover { color: var(--text); }
  #gate .tokenRow { display: none; flex-direction: column; gap: 10px; margin-top: 12px; }
  #gate .tokenRow.show { display: flex; }
  #gate .gateLogo { display: block; width: 100%; max-width: 220px; height: auto; }
  .brandRow { display: flex; align-items: center; gap: 9px; }
  .brandIcon { width: 24px; height: 24px; display: block; flex-shrink: 0; }
  #app { display: none; max-width: 1160px; margin: 0 auto; padding: 28px 20px 60px; }
  header.top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  header.top h1 { font-size: 15px; margin: 0; letter-spacing: 0.02em; }
  header.top .sub { color: var(--muted); font-size: 11.5px; font-family: var(--mono); }
  header.top .right { display: flex; align-items: center; gap: 10px; }
  #dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); display: inline-block; }
  .logout { background: none; border: 1px solid var(--border); color: var(--muted); padding: 5px 10px; border-radius: 6px; font-size: 11px; cursor: pointer; }

  .topnav { display: flex; gap: 6px; margin-bottom: 24px; border-bottom: 1px solid var(--border); padding-bottom: 12px; flex-wrap: wrap; }
  .topnav a { color: var(--muted); text-decoration: none; font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: 6px; letter-spacing: 0.02em; }
  .topnav a:hover { color: var(--text); background: var(--panel-2); }
  .topnav a.active { color: #04140e; background: var(--accent); }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px,1fr)); gap: 12px; margin-bottom: 22px; }
  .cards .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .cards .card .n { font-family: var(--mono); font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .cards .card .l { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 2px; }
  .cards .card.live .n { color: var(--accent); }

  section { margin-bottom: 24px; }
  section h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 10px; }
  .sectionhead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .sectionhead h2 { margin: 0; }

  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .tablewrap { overflow-x: auto; border-radius: 10px; border: 1px solid var(--border); }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--border); font-size: 12.5px; white-space: nowrap; }
  th { color: var(--muted); text-transform: uppercase; font-size: 10.5px; letter-spacing: 0.04em; background: var(--panel-2); }
  td.path { white-space: normal; max-width: 420px; font-family: var(--mono); font-size: 12px; }
  tr:last-child td { border-bottom: none; }
  tr.fresh { animation: flash 1.6s ease-out; }
  @keyframes flash { from { background: var(--accent-dim); } to { background: transparent; } }
  .empty { color: var(--muted); font-size: 12.5px; padding: 20px; text-align: center; }
  select#siteSelect {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    padding: 6px 10px; border-radius: 6px; font-size: 12px; font-family: var(--mono);
  }
</style>
</head>
<body>

<div id="gate">
  <img src="/static/img/cgc_logo.png" alt="CGC Core" class="gateLogo">
  <div class="card">
    <h1>CGC Core — Analytics</h1>
    <p>Sign in to view real-time site traffic.</p>
    <form id="loginForm">
      <input id="emailInput" type="email" placeholder="Email" autocomplete="username" required>
      <input id="passwordInput" type="password" placeholder="Password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
    </form>
    <div class="divider">or</div>
    <button type="button" class="linkBtn" id="tokenToggle">Use an API token instead</button>
    <div class="tokenRow" id="tokenRow">
      <input id="keyInput" type="password" placeholder="CGC_SERVICE_API_KEY or token" autocomplete="off">
      <button type="button" onclick="connectToken()">Connect with token</button>
    </div>
    <div class="err" id="gateErr"></div>
  </div>
</div>

<div id="app">
  <header class="top">
    <div class="brandRow">
      <img src="/static/img/cgc_icon.png" alt="" class="brandIcon">
      <div>
        <h1>CGC Core — Analytics</h1>
        <div class="sub">cgc-cre.vercel.app</div>
      </div>
    </div>
    <div class="right">
      <span id="dot"></span>
      <span class="sub" id="lastRefresh">—</span>
      <button class="logout" onclick="disconnect()">Disconnect</button>
    </div>
  </header>

  <nav class="topnav">
    <a href="/dashboard">Home</a>
    <a href="/dashboard/governance">Governance</a>
    <a href="/dashboard/scoring">Scoring</a>
    <a href="/dashboard/security">Security</a>
    <a href="/dashboard/analytics" class="active">Analytics</a>
    <a href="/dashboard/tenants">Tenants</a>
    <a href="/dashboard/launch-readiness">Launch Readiness</a>
  </nav>

  <div class="sectionhead">
    <h2>Site</h2>
    <select id="siteSelect" onchange="switchSite(this.value)">
      <option value="controlmiles.com">controlmiles.com</option>
    </select>
  </div>

  <section>
    <div class="cards" id="statCards">
      <div class="card live"><div class="n" id="activeCount">—</div><div class="l">Active now (5 min)</div></div>
      <div class="card"><div class="n" id="todayCount">—</div><div class="l">Views today</div></div>
    </div>
  </section>

  <section>
    <h2>Top Pages (24h)</h2>
    <div class="tablewrap">
      <table id="topPathsTable">
        <thead><tr><th>Path</th><th>Views</th></tr></thead>
        <tbody id="topPathsBody"></tbody>
      </table>
    </div>
  </section>

  <section>
    <h2>Live Feed</h2>
    <div class="tablewrap">
      <table id="feedTable">
        <thead><tr><th>Path</th><th>Referrer</th><th>Country</th><th>When</th></tr></thead>
        <tbody id="feedBody"></tbody>
      </table>
    </div>
  </section>
</div>

<script>
const API = window.location.origin;
let TOKEN = localStorage.getItem('cgc_dash_token') || '';
let timer = null;
let currentSite = 'controlmiles.com';
const FEED_MAX_ROWS = 40;

async function connectWithPassword(e) {
  e.preventDefault();
  const email = document.getElementById('emailInput').value.trim();
  const password = document.getElementById('passwordInput').value;
  if (!email || !password) return;
  document.getElementById('gateErr').textContent = '';
  try {
    const r = await fetch(API + '/auth/signin', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || 'Sign in failed');
    TOKEN = data.access_token;
    localStorage.setItem('cgc_dash_token', TOKEN);
    boot();
  } catch (err) {
    document.getElementById('gateErr').textContent = err.message;
  }
}
document.getElementById('loginForm').addEventListener('submit', connectWithPassword);
document.getElementById('tokenToggle').addEventListener('click', () => {
  document.getElementById('tokenRow').classList.toggle('show');
});

function connectToken() {
  const v = document.getElementById('keyInput').value.trim();
  if (!v) return;
  TOKEN = v;
  localStorage.setItem('cgc_dash_token', v);
  boot();
}
function disconnect() {
  localStorage.removeItem('cgc_dash_token');
  TOKEN = '';
  if (timer) clearInterval(timer);
  stopLiveStream();
  document.getElementById('app').style.display = 'none';
  document.getElementById('gate').style.display = 'flex';
}

async function api(path) {
  const r = await fetch(API + path, { headers: { 'Authorization': 'Bearer ' + TOKEN } });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function switchSite(site) {
  currentSite = site;
  stopLiveStream();
  document.getElementById('feedBody').innerHTML = '';
  refresh();
  startLiveStream();
}

async function refresh() {
  try {
    const summary = await api('/analytics/summary?site=' + encodeURIComponent(currentSite));
    document.getElementById('activeCount').textContent = summary.active_visitors ?? 0;
    document.getElementById('todayCount').textContent = summary.total_today ?? 0;

    const rows = summary.top_paths || [];
    document.getElementById('topPathsBody').innerHTML = rows.length ? rows.map(r => `
      <tr><td class="path">${esc(r.path)}</td><td>${esc(r.views)}</td></tr>
    `).join('') : `<tr><td colspan="2" class="empty">No pageviews yet</td></tr>`;

    document.getElementById('dot').style.background = 'var(--green)';
    document.getElementById('lastRefresh').textContent = 'updated ' + new Date().toLocaleTimeString();
  } catch (e) {
    document.getElementById('dot').style.background = 'var(--red)';
    document.getElementById('lastRefresh').textContent = 'error: ' + e.message;
  }
}

// ---- Live feed (SSE via GET /analytics/stream) ----
// Same fetch()+manual-reader approach as dashboard_security.html's
// startLiveErrorStream, for the same reason: native EventSource can't
// send the Authorization header this endpoint requires. See that file's
// own comment for the full explanation of the self-closing/reconnect
// design -- not repeated here.
let streamAbortController = null;

function stopLiveStream() {
  if (streamAbortController) {
    streamAbortController.abort();
    streamAbortController = null;
  }
}

function prependFeedRow(view) {
  const tbody = document.getElementById('feedBody');
  if (tbody.querySelector('.empty')) tbody.innerHTML = '';
  const tr = document.createElement('tr');
  tr.className = 'fresh';
  const when = view.viewed_at ? new Date(view.viewed_at).toLocaleTimeString() : '';
  tr.innerHTML = `
    <td class="path">${esc(view.path)}</td>
    <td>${esc(view.referrer || '—')}</td>
    <td>${esc(view.country || '—')}</td>
    <td>${esc(when)}</td>
  `;
  tbody.insertBefore(tr, tbody.firstChild);
  while (tbody.rows.length > FEED_MAX_ROWS) tbody.deleteRow(tbody.rows.length - 1);
}

async function startLiveStream() {
  const myController = new AbortController();
  streamAbortController = myController;
  const site = currentSite;

  try {
    const r = await fetch(API + '/analytics/stream?site=' + encodeURIComponent(site), {
      headers: { 'Authorization': 'Bearer ' + TOKEN },
      signal: myController.signal,
    });
    if (!r.ok || !r.body) throw new Error('stream HTTP ' + r.status);

    const reader = r.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const events = buffer.split('\n\n');
      buffer = events.pop() ?? '';
      for (const evt of events) {
        if (!evt.startsWith('data:')) continue;
        try {
          const view = JSON.parse(evt.slice(5).trim());
          prependFeedRow(view);
          if (site === currentSite) {
            const el = document.getElementById('activeCount');
            // Cheap optimistic bump; the next /summary poll corrects it
            // to the real distinct-session count.
            el.textContent = (parseInt(el.textContent, 10) || 0) + 0;
          }
        } catch (e) { /* ignore malformed event */ }
      }
    }
  } catch (e) {
    if (myController.signal.aborted) return;
  }

  if (TOKEN && streamAbortController === myController) {
    setTimeout(() => { if (TOKEN && currentSite === site) startLiveStream(); }, 1500);
  }
}

async function boot() {
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  try {
    await api('/analytics/summary?site=' + encodeURIComponent(currentSite));
  } catch (e) {
    document.getElementById('app').style.display = 'none';
    document.getElementById('gate').style.display = 'flex';
    document.getElementById('gateErr').textContent = 'Invalid token or connection failed.';
    return;
  }
  refresh();
  timer = setInterval(refresh, 30000);
  startLiveStream();
}

if (TOKEN) boot();
</script>
</body>
</html>
