<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CGC Core — Launch Readiness</title>
<link rel="icon" type="image/png" sizes="32x32" href="/static/img/cgc_favicon_32.png">
<link rel="icon" type="image/png" sizes="64x64" href="/static/img/cgc_favicon_64.png">
<link rel="apple-touch-icon" sizes="180x180" href="/static/img/cgc_favicon_180.png">
<style>
  :root {
    --bg: #0b0f0e;
    --panel: #121816;
    --panel-2: #171f1c;
    --border: #253430;
    --text: #e6efe9;
    --muted: #7d9089;
    --accent: #4fd8a8;
    --accent-dim: rgba(79,216,168,0.12);
    --red: #ea8a78;
    --red-bg: rgba(234,138,120,0.12);
    --amber: #e8b454;
    --amber-bg: rgba(232,180,84,0.12);
    --green: #4ed892;
    --green-bg: rgba(78,216,146,0.12);
    --mono: ui-monospace, "SF Mono", Consolas, monospace;
    --sans: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--sans); font-size: 14px; line-height: 1.5;
  }
  #gate {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 60px; padding: 24px;
  }
  #gate .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 40px 36px; width: 100%; max-width: 400px;
  }
  #gate h1 { font-size: 16px; margin: 0 0 4px; letter-spacing: 0.02em; }
  #gate p { color: var(--muted); font-size: 12.5px; margin: 0 0 18px; }
  #gate input {
    width: 100%; background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 6px; padding: 9px 10px; color: var(--text); font-family: var(--mono);
    font-size: 12.5px; margin-bottom: 10px;
  }
  #gate button, .btn {
    background: var(--accent); color: #04140e; border: none; border-radius: 6px;
    padding: 9px 14px; font-weight: 700; font-size: 12.5px; cursor: pointer; width: 100%;
  }
  .btn.secondary { background: none; border: 1px solid var(--border); color: var(--text); }
  .btn.small { width: auto; padding: 5px 10px; font-size: 11px; }
  .btn.danger { background: var(--red-bg); color: var(--red); border: 1px solid var(--red); }
  #gate .err { color: var(--red); font-size: 12px; margin-top: 8px; min-height: 16px; }
  #gate form { display: flex; flex-direction: column; gap: 10px; }
  #gate .divider { display: flex; align-items: center; gap: 10px; margin: 16px 0 10px; color: var(--muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; }
  #gate .divider::before, #gate .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  #gate .linkBtn { background: none; border: none; color: var(--muted); font-size: 11.5px; cursor: pointer; padding: 0; width: auto; font-weight: 600; text-decoration: underline; }
  #gate .linkBtn:hover { color: var(--text); }
  #gate .tokenRow { display: none; flex-direction: column; gap: 10px; margin-top: 12px; }
  #gate .tokenRow.show { display: flex; }
  #gate .gateLogo { display: block; width: 100%; max-width: 220px; height: auto; }
  .brandRow { display: flex; align-items: center; gap: 9px; }
  .brandIcon { width: 24px; height: 24px; display: block; flex-shrink: 0; }
  #app { display: none; max-width: 1160px; margin: 0 auto; padding: 28px 20px 60px; }
  header.top {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;
  }
  header.top h1 { font-size: 15px; margin: 0; letter-spacing: 0.02em; }
  header.top .sub { color: var(--muted); font-size: 11.5px; font-family: var(--mono); }
  header.top .right { display: flex; align-items: center; gap: 10px; }
  #dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); display: inline-block; }
  .logout { background: none; border: 1px solid var(--border); color: var(--muted); padding: 5px 10px; border-radius: 6px; font-size: 11px; cursor: pointer; }

  .topnav { display: flex; gap: 6px; margin-bottom: 24px; border-bottom: 1px solid var(--border); padding-bottom: 12px; flex-wrap: wrap; }
  .topnav a {
    color: var(--muted); text-decoration: none; font-size: 12px; font-weight: 700;
    padding: 6px 12px; border-radius: 6px; letter-spacing: 0.02em;
  }
  .topnav a:hover { color: var(--text); background: var(--panel-2); }
  .topnav a.active { color: #04140e; background: var(--accent); }

  section { margin-bottom: 24px; }
  section h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 10px; }
  .empty { color: var(--muted); font-size: 12.5px; padding: 20px; text-align: center; }

  .formCard { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; }
  .formRow { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
  .fieldGroup { display: flex; flex-direction: column; gap: 4px; }
  .fieldGroup label { color: var(--muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.04em; }
  .field { background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px; padding: 9px 10px; color: var(--text); font-family: var(--mono); font-size: 12.5px; min-width: 160px; }
  select.field { font-family: var(--sans); }
  .msg { font-size: 12px; margin-top: 10px; min-height: 16px; }
  .msg.err { color: var(--red); }
  .msg.ok { color: var(--green); }

  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .tablewrap { overflow-x: auto; border-radius: 10px; border: 1px solid var(--border); }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--border); font-size: 12.5px; white-space: nowrap; }
  th { color: var(--muted); text-transform: uppercase; font-size: 10.5px; letter-spacing: 0.04em; background: var(--panel-2); }
  tr:last-child td { border-bottom: none; }
  td.wrap { white-space: normal; }
  td.actions { display: flex; gap: 6px; }
  .pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 100px; font-size: 10.5px; font-weight: 700; }
  .pill::before { content: ""; width: 5px; height: 5px; border-radius: 50%; }
  .pill.done { background: var(--green-bg); color: var(--green); }
  .pill.done::before { background: var(--green); }
  .pill.pending { background: var(--amber-bg); color: var(--amber); }
  .pill.pending::before { background: var(--amber); }
  .pill.blocked { background: var(--red-bg); color: var(--red); }
  .pill.blocked::before { background: var(--red); }

  .scoreRow { display: flex; gap: 14px; flex-wrap: wrap; }
  .scoreCard {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px 20px; min-width: 140px; flex: 1;
  }
  .scoreCard .n { font-size: 26px; font-weight: 800; font-family: var(--mono); }
  .scoreCard .l { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; margin-top: 2px; }
  .scoreCard.done .n { color: var(--green); }
  .scoreCard.pending .n { color: var(--amber); }
  .scoreCard.blocked .n { color: var(--red); }

  .snapCard { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; margin-bottom: 12px; }
  .snapCard h3 { margin: 0 0 4px; font-size: 12.5px; }
  .snapCard .meta { color: var(--muted); font-size: 11px; font-family: var(--mono); margin-bottom: 10px; }
  .snapCard pre {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px;
    padding: 10px 12px; font-size: 11.5px; overflow-x: auto; margin: 0; color: var(--text);
  }
  .select { background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px; color: var(--text); padding: 8px 10px; font-size: 12.5px; }
</style>
</head>
<body>

<div id="gate">
  <img src="/static/img/cgc_logo.png" alt="CGC Core" class="gateLogo">
  <div class="card">
    <form id="loginForm">
      <input id="emailInput" type="email" placeholder="Email" autocomplete="username" required>
      <input id="passwordInput" type="password" placeholder="Password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
    </form>
    <div class="divider">or</div>
    <button type="button" class="linkBtn" id="tokenToggle">Use an API token instead</button>
    <div class="tokenRow" id="tokenRow">
      <input id="keyInput" type="password" placeholder="CGC_SERVICE_API_KEY or token" autocomplete="off">
      <button type="button" onclick="connectToken()">Connect with token</button>
    </div>
    <div class="err" id="gateErr"></div>
  </div>
</div>

<div id="app">
  <header class="top">
    <div class="brandRow">
      <img src="/static/img/cgc_icon.png" alt="" class="brandIcon">
      <div>
        <h1>CGC Core — Launch Readiness</h1>
        <div class="sub">cgc-cre.vercel.app</div>
      </div>
    </div>
    <div class="right">
      <span id="dot"></span>
      <span class="sub" id="lastRefresh">—</span>
      <button class="logout" onclick="disconnect()">Disconnect</button>
    </div>
  </header>

  <nav class="topnav">
    <a href="/dashboard">Home</a>
    <a href="/dashboard/governance">Governance</a>
    <a href="/dashboard/scoring">Scoring</a>
    <a href="/dashboard/security">Security</a>
    <a href="/dashboard/analytics">Analytics</a>
    <a href="/dashboard/tenants">Tenants</a>
    <a href="/dashboard/launch-readiness" class="active">Launch Readiness</a>
  </nav>

  <section>
    <div class="formRow" style="margin-bottom:14px;">
      <div class="fieldGroup">
        <label for="appSourceSelect">App</label>
        <select id="appSourceSelect" class="select">
          <option value="controlmiles">controlmiles</option>
        </select>
      </div>
      <button class="btn" style="width:auto" onclick="refreshSignals()">Refresh automated signals</button>
      <div class="msg" id="refreshMsg" style="align-self:center;"></div>
    </div>

    <h2>Readiness</h2>
    <div class="scoreRow">
      <div class="scoreCard done"><div class="n" id="countDone">—</div><div class="l">Done</div></div>
      <div class="scoreCard pending"><div class="n" id="countPending">—</div><div class="l">Pending</div></div>
      <div class="scoreCard blocked"><div class="n" id="countBlocked">—</div><div class="l">Blocked</div></div>
    </div>
  </section>

  <section>
    <h2>Automated Signals</h2>
    <div id="snapshots"></div>
  </section>

  <section>
    <h2>Add Checklist Item</h2>
    <div class="formCard">
      <div class="formRow">
        <div class="fieldGroup">
          <label for="newCategory">Category</label>
          <input id="newCategory" class="field" placeholder="e.g. Play Console">
        </div>
        <div class="fieldGroup">
          <label for="newItem">Item</label>
          <input id="newItem" class="field" placeholder="e.g. Data Safety form submitted" style="min-width:280px;">
        </div>
        <div class="fieldGroup">
          <label for="newStatus">Status</label>
          <select id="newStatus" class="field">
            <option value="pending">pending</option>
            <option value="done">done</option>
            <option value="blocked">blocked</option>
          </select>
        </div>
        <button class="btn" style="width:auto" onclick="addChecklistItem()">Add</button>
      </div>
      <div class="msg" id="addMsg"></div>
    </div>
  </section>

  <section>
    <h2>Checklist</h2>
    <div class="tablewrap">
      <table id="checklistTable">
        <thead><tr><th>Category</th><th>Item</th><th>Status</th><th>Note</th><th>Updated</th><th>Actions</th></tr></thead>
        <tbody id="checklistBody"></tbody>
      </table>
    </div>
  </section>
</div>

<script>
const API = window.location.origin;
let TOKEN = localStorage.getItem('cgc_dash_token') || '';
let timer = null;

async function connectWithPassword(e) {
  e.preventDefault();
  const email = document.getElementById('emailInput').value.trim();
  const password = document.getElementById('passwordInput').value;
  if (!email || !password) return;
  document.getElementById('gateErr').textContent = '';
  try {
    const r = await fetch(API + '/auth/signin', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || 'Sign in failed');
    TOKEN = data.access_token;
    localStorage.setItem('cgc_dash_token', TOKEN);
    boot();
  } catch (err) {
    document.getElementById('gateErr').textContent = err.message;
  }
}
document.getElementById('loginForm').addEventListener('submit', connectWithPassword);
document.getElementById('tokenToggle').addEventListener('click', () => {
  document.getElementById('tokenRow').classList.toggle('show');
});

function connectToken() {
  const v = document.getElementById('keyInput').value.trim();
  if (!v) return;
  TOKEN = v;
  localStorage.setItem('cgc_dash_token', v);
  boot();
}
function disconnect() {
  localStorage.removeItem('cgc_dash_token');
  TOKEN = '';
  if (timer) clearInterval(timer);
  document.getElementById('app').style.display = 'none';
  document.getElementById('gate').style.display = 'flex';
}

async function api(path, options) {
  const r = await fetch(API + path, {
    ...options,
    headers: { 'Authorization': 'Bearer ' + TOKEN, ...(options && options.headers) },
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail || ('HTTP ' + r.status));
  return data;
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDate(s) {
  if (!s) return '—';
  return String(s).slice(0, 19).replace('T', ' ');
}
function currentAppSource() {
  return document.getElementById('appSourceSelect').value;
}

// ---- Checklist ----
async function addChecklistItem() {
  const category = document.getElementById('newCategory').value.trim();
  const item = document.getElementById('newItem').value.trim();
  const status = document.getElementById('newStatus').value;
  const msgEl = document.getElementById('addMsg');
  msgEl.className = 'msg';
  msgEl.textContent = '';
  if (!category || !item) { msgEl.className = 'msg err'; msgEl.textContent = 'Category and item are required.'; return; }

  try {
    await api(`/launch-readiness/${currentAppSource()}/checklist`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ category, item, status }),
    });
    document.getElementById('newCategory').value = '';
    document.getElementById('newItem').value = '';
    document.getElementById('newStatus').value = 'pending';
    await refresh();
  } catch (e) {
    msgEl.className = 'msg err';
    msgEl.textContent = e.message;
  }
}

// Keyed by id after every refresh() -- cycleStatus looks the real
// category/item up here instead of round-tripping them through an inline
// onclick attribute (avoids any HTML-escaping edge case in item text).
let checklistById = {};

async function cycleStatus(id) {
  const current = checklistById[id];
  if (!current) return;
  const order = ['pending', 'done', 'blocked'];
  const next = order[(order.indexOf(current.status) + 1) % order.length];
  try {
    await api(`/launch-readiness/${currentAppSource()}/checklist`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, status: next, category: current.category, item: current.item, note: current.note }),
    });
    await refresh();
  } catch (e) {
    alert('Update failed: ' + e.message);
  }
}

async function deleteItem(id) {
  if (!confirm('Delete this checklist item?')) return;
  try {
    await api(`/launch-readiness/${currentAppSource()}/checklist/${id}`, { method: 'DELETE' });
    await refresh();
  } catch (e) {
    alert('Delete failed: ' + e.message);
  }
}

// ---- Automated signals ----
async function refreshSignals() {
  const msgEl = document.getElementById('refreshMsg');
  msgEl.className = 'msg';
  msgEl.textContent = 'Refreshing…';
  try {
    await api(`/launch-readiness/${currentAppSource()}/refresh`, { method: 'POST' });
    msgEl.className = 'msg ok';
    msgEl.textContent = 'Done.';
    await refresh();
  } catch (e) {
    msgEl.className = 'msg err';
    msgEl.textContent = e.message;
  }
}

function renderSnapshots(snapshots) {
  const el = document.getElementById('snapshots');
  if (!snapshots || !snapshots.length) {
    el.innerHTML = `<div class="empty">No automated signals pulled yet — click "Refresh automated signals" above.</div>`;
    return;
  }
  el.innerHTML = snapshots.map(s => `
    <div class="snapCard">
      <h3>${esc(s.source)}</h3>
      <div class="meta">fetched ${fmtDate(s.fetched_at)}</div>
      <pre>${esc(JSON.stringify(s.payload, null, 2))}</pre>
    </div>
  `).join('');
}

// ---- Refresh (page data, not the automated pull) ----
async function refresh() {
  const appSource = currentAppSource();
  try {
    const [summary, checklist] = await Promise.all([
      api(`/launch-readiness/${appSource}/summary`),
      api(`/launch-readiness/${appSource}/checklist`),
    ]);

    const counts = summary.checklist_counts || {};
    document.getElementById('countDone').textContent = counts.done || 0;
    document.getElementById('countPending').textContent = counts.pending || 0;
    document.getElementById('countBlocked').textContent = counts.blocked || 0;

    renderSnapshots(summary.snapshots || []);

    const items = checklist.items || [];
    checklistById = {};
    items.forEach(it => { checklistById[it.id] = it; });
    document.getElementById('checklistBody').innerHTML = items.length ? items.map(it => `
      <tr>
        <td>${esc(it.category)}</td>
        <td class="wrap">${esc(it.item)}</td>
        <td><span class="pill ${esc(it.status)}" style="cursor:pointer" onclick="cycleStatus(${it.id})" title="Click to cycle status">${esc(it.status)}</span></td>
        <td class="wrap">${esc(it.note || '—')}</td>
        <td>${fmtDate(it.updated_at)}</td>
        <td class="actions"><button class="btn danger small" onclick="deleteItem(${it.id})">Delete</button></td>
      </tr>
    `).join('') : `<tr><td colspan="6" class="empty">No checklist items yet — add one above.</td></tr>`;

    document.getElementById('dot').style.background = 'var(--green)';
    document.getElementById('gateErr').textContent = '';
    document.getElementById('lastRefresh').textContent = 'updated ' + new Date().toLocaleTimeString();
  } catch (e) {
    document.getElementById('dot').style.background = 'var(--red)';
    document.getElementById('lastRefresh').textContent = 'error: ' + e.message;
  }
}

document.getElementById('appSourceSelect').addEventListener('change', refresh);

async function boot() {
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  try {
    await api(`/launch-readiness/${currentAppSource()}/summary`);
  } catch (e) {
    document.getElementById('app').style.display = 'none';
    document.getElementById('gate').style.display = 'flex';
    document.getElementById('gateErr').textContent = 'Invalid token.';
    return;
  }
  refresh();
  timer = setInterval(refresh, 30000);
}

if (TOKEN) boot();
</script>
</body>
</html>
