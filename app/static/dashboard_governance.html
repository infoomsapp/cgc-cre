<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CGC Core — Governance</title>
<style>
  :root {
    --bg: #0b0f0e;
    --panel: #121816;
    --panel-2: #171f1c;
    --border: #253430;
    --text: #e6efe9;
    --muted: #7d9089;
    --accent: #4fd8a8;
    --accent-dim: rgba(79,216,168,0.12);
    --red: #ea8a78;
    --red-bg: rgba(234,138,120,0.12);
    --amber: #e8b454;
    --amber-bg: rgba(232,180,84,0.12);
    --green: #4ed892;
    --green-bg: rgba(78,216,146,0.12);
    /* Matches LedgiProof's "Certification Blue" semaphore color exactly
       (semaphore.blue.DEFAULT, tailwind.config.ts) -- approved decisions
       here use the same blue as a verified/certified record over there,
       deliberately not this page's own --accent green. */
    --verified-blue: #2563eb;
    --verified-blue-bg: rgba(37,99,235,0.12);
    --mono: ui-monospace, "SF Mono", Consolas, monospace;
    --sans: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--sans); font-size: 14px; line-height: 1.5;
  }
  #gate {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 16px; padding: 24px;
  }
  #gate .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 28px; width: 100%; max-width: 380px;
  }
  #gate h1 { font-size: 16px; margin: 0 0 4px; letter-spacing: 0.02em; }
  #gate p { color: var(--muted); font-size: 12.5px; margin: 0 0 18px; }
  #gate input {
    width: 100%; background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 6px; padding: 9px 10px; color: var(--text); font-family: var(--mono);
    font-size: 12.5px; margin-bottom: 10px;
  }
  #gate button, .btn {
    background: var(--accent); color: #04140e; border: none; border-radius: 6px;
    padding: 9px 14px; font-weight: 700; font-size: 12.5px; cursor: pointer; width: 100%;
  }
  #gate .err { color: var(--red); font-size: 12px; margin-top: 8px; min-height: 16px; }
  #app { display: none; max-width: 1160px; margin: 0 auto; padding: 28px 20px 60px; }
  header.top {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;
  }
  header.top h1 { font-size: 15px; margin: 0; letter-spacing: 0.02em; }
  header.top .sub { color: var(--muted); font-size: 11.5px; font-family: var(--mono); }
  header.top .right { display: flex; align-items: center; gap: 10px; }
  #dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); display: inline-block; }
  .logout { background: none; border: 1px solid var(--border); color: var(--muted); padding: 5px 10px; border-radius: 6px; font-size: 11px; cursor: pointer; }

  .topnav { display: flex; gap: 6px; margin-bottom: 24px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
  .topnav a {
    color: var(--muted); text-decoration: none; font-size: 12px; font-weight: 700;
    padding: 6px 12px; border-radius: 6px; letter-spacing: 0.02em;
  }
  .topnav a:hover { color: var(--text); background: var(--panel-2); }
  .topnav a.active { color: #04140e; background: var(--accent); }

  section { margin-bottom: 24px; }
  section h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 10px; }

  .modgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px,1fr)); gap: 8px; }
  .mod { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; display: flex; align-items: center; gap: 8px; }
  .mod .m-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
  .mod .m-dot.off { background: var(--red); }
  .mod .m-name { font-family: var(--mono); font-size: 11.5px; }
  .empty { color: var(--muted); font-size: 12.5px; padding: 20px; text-align: center; }

  .chartCard { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; }
  .chartCard .chartHead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .chartCard .chartTitle { font-size: 12px; font-weight: 700; }
  .chartLegend { display: flex; gap: 14px; font-size: 11px; color: var(--muted); }
  .chartLegend .lg { display: flex; align-items: center; gap: 5px; }
  .chartLegend .sw { width: 8px; height: 8px; border-radius: 2px; }
  .chartTabs { display: flex; gap: 6px; }
  .chartTabs button { background: none; border: 1px solid var(--border); color: var(--muted); font-size: 10.5px; padding: 3px 9px; border-radius: 5px; cursor: pointer; }
  .chartTabs button.active { color: #04140e; background: var(--accent); border-color: var(--accent); }

  .field { background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px; padding: 9px 10px; color: var(--text); font-family: var(--mono); font-size: 12.5px; }
  .reportControls { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 14px; }
  .reportControls .fieldGroup { display: flex; flex-direction: column; gap: 4px; }
  .reportControls label { color: var(--muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.04em; }
  .reportControls .btn { width: auto; padding: 9px 18px; }
  .reportViewerCard { display: none; padding: 0; overflow: hidden; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; }
  .reportViewerBar { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid var(--border); background: var(--panel-2); }
  .reportViewerBar .logout { width: auto; padding: 5px 12px; }
  #reportViewer { width: 100%; height: 640px; border: none; display: block; }
</style>
</head>
<body>

<div id="gate">
  <div class="card">
    <h1>CGC Core — Governance</h1>
    <p>Paste your Bearer token to connect. Stored only in this browser.</p>
    <input id="keyInput" type="password" placeholder="CGC_SERVICE_API_KEY or token" autocomplete="off">
    <button onclick="connect()">Connect</button>
    <div class="err" id="gateErr"></div>
  </div>
</div>

<div id="app">
  <header class="top">
    <div>
      <h1>CGC Core — Governance</h1>
      <div class="sub">cgc-cre.vercel.app</div>
    </div>
    <div class="right">
      <span id="dot"></span>
      <span class="sub" id="lastRefresh">—</span>
      <button class="logout" onclick="disconnect()">Disconnect</button>
    </div>
  </header>

  <nav class="topnav">
    <a href="/dashboard">Home</a>
    <a href="/dashboard/governance" class="active">Governance</a>
    <a href="/dashboard/scoring">Scoring</a>
    <a href="/dashboard/security">Security</a>
  </nav>

  <section>
    <h2>Governance Modules</h2>
    <div class="modgrid" id="modGrid"></div>
  </section>

  <section>
    <h2>Decision Volume (24h)</h2>
    <div class="chartCard">
      <div class="chartHead">
        <div class="chartTabs" id="volAppTabs">
          <button class="active" data-app="ledgiproof" onclick="setVolApp(this)">LedgiProof</button>
          <button data-app="ledgiproof-tax-pro" onclick="setVolApp(this)">Tax Pro</button>
        </div>
        <div class="chartLegend">
          <span class="lg"><span class="sw" style="background:var(--verified-blue)"></span>Approved</span>
          <span class="lg"><span class="sw" style="background:var(--amber)"></span>Other outcome</span>
        </div>
      </div>
      <div id="volChart"></div>
    </div>
  </section>

  <section>
    <h2>Governance Reports</h2>
    <div class="reportControls">
      <div class="fieldGroup">
        <label for="reportAppSource">App</label>
        <select id="reportAppSource" class="field">
          <option value="ledgiproof">LedgiProof</option>
          <option value="ledgiproof-tax-pro">LedgiProof Tax Pro</option>
        </select>
      </div>
      <div class="fieldGroup">
        <label for="reportFrom">From</label>
        <input type="date" id="reportFrom" class="field">
      </div>
      <div class="fieldGroup">
        <label for="reportTo">To</label>
        <input type="date" id="reportTo" class="field">
      </div>
      <button class="btn" onclick="generateReport()">Generate Report</button>
    </div>
    <div class="reportViewerCard" id="reportViewerCard">
      <div class="reportViewerBar">
        <span class="sub">Report preview</span>
        <button class="logout" onclick="closeReport()">Close</button>
      </div>
      <iframe id="reportViewer"></iframe>
    </div>
  </section>
</div>

<script>
const API = window.location.origin;
let TOKEN = localStorage.getItem('cgc_dash_token') || '';
let timer = null;

function connect() {
  const v = document.getElementById('keyInput').value.trim();
  if (!v) return;
  TOKEN = v;
  localStorage.setItem('cgc_dash_token', v);
  boot();
}
function disconnect() {
  localStorage.removeItem('cgc_dash_token');
  TOKEN = '';
  if (timer) clearInterval(timer);
  document.getElementById('app').style.display = 'none';
  document.getElementById('gate').style.display = 'flex';
}

async function api(path) {
  const r = await fetch(API + path, { headers: { 'Authorization': 'Bearer ' + TOKEN } });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---- Decision volume chart (real hourly data from GET /governance/timeseries/{app}) ----
let volApp = 'ledgiproof';
function setVolApp(btn) {
  volApp = btn.dataset.app;
  document.querySelectorAll('#volAppTabs button').forEach(b => b.classList.toggle('active', b === btn));
  loadVolumeChart();
}

function renderStackedBarChart(buckets, hours) {
  // Builds a continuous hour axis (fills gaps with 0) so a quiet hour reads
  // as a real gap in activity, not a missing data point -- see
  // TCO.get_decision_timeseries()'s docstring for why the API itself
  // doesn't zero-fill server-side.
  const now = new Date(); now.setUTCMinutes(0, 0, 0, 0);
  const axis = [];
  for (let i = hours - 1; i >= 0; i--) axis.push(new Date(now.getTime() - i * 3600000));
  const byHour = {};
  (buckets || []).forEach(b => { byHour[new Date(b.bucket).getTime()] = b; });

  const W = 720, H = 170, padT = 8, padB = 20;
  const chartH = H - padT - padB;
  const n = axis.length;
  const slot = W / n;
  const barW = Math.max(2, slot - 3);
  const maxTotal = Math.max(1, ...axis.map(d => (byHour[d.getTime()] || {}).total || 0));

  let bars = '';
  axis.forEach((d, i) => {
    const b = byHour[d.getTime()];
    const total = b ? b.total : 0;
    const approved = b ? b.approved : 0;
    const other = total - approved;
    const x = i * slot + (slot - barW) / 2;
    const hApproved = total ? Math.max((approved / maxTotal) * chartH, approved > 0 ? 2 : 0) : 0;
    const hOther = total ? (other / maxTotal) * chartH : 0;
    const yApproved = padT + chartH - hApproved;
    const yOther = yApproved - hOther;
    const label = `${d.toISOString().slice(11, 16)} UTC — ${total} decision${total === 1 ? '' : 's'}${total ? `, ${approved} approved` : ''}`;
    if (total === 0) {
      bars += `<rect x="${x.toFixed(1)}" y="${(padT + chartH - 1).toFixed(1)}" width="${barW}" height="1" fill="var(--border)"><title>${esc(label)}</title></rect>`;
    } else {
      if (hOther > 0) bars += `<rect x="${x.toFixed(1)}" y="${yOther.toFixed(1)}" width="${barW}" height="${hOther.toFixed(1)}" fill="var(--amber)" rx="1"><title>${esc(label)}</title></rect>`;
      bars += `<rect x="${x.toFixed(1)}" y="${yApproved.toFixed(1)}" width="${barW}" height="${hApproved.toFixed(1)}" fill="var(--verified-blue)" rx="1"><title>${esc(label)}</title></rect>`;
    }
  });

  const tickEvery = Math.max(1, Math.round(n / 8));
  let ticks = '';
  axis.forEach((d, i) => {
    if (i % tickEvery !== 0) return;
    const x = i * slot + slot / 2;
    ticks += `<text x="${x.toFixed(1)}" y="${H - 6}" text-anchor="middle" font-size="9" fill="var(--muted)" font-family="var(--mono)">${d.toISOString().slice(11, 13)}h</text>`;
  });

  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none">${bars}${ticks}</svg>`;
}

async function loadVolumeChart() {
  try {
    const data = await api(`/governance/timeseries/${volApp}?hours=24`);
    document.getElementById('volChart').innerHTML = (data.buckets && data.buckets.length)
      ? renderStackedBarChart(data.buckets, 24)
      : '<div class="empty">No decisions in the last 24h</div>';
  } catch (e) {
    document.getElementById('volChart').innerHTML = `<div class="empty">Chart unavailable: ${esc(e.message)}</div>`;
  }
}

async function refresh() {
  try {
    const nodes = await api('/status/nodes');
    document.getElementById('dot').style.background = 'var(--green)';
    document.getElementById('gateErr').textContent = '';

    const mods = nodes.nodes || {};
    document.getElementById('modGrid').innerHTML = Object.keys(mods).map(k => {
      const active = mods[k] && (mods[k].status === 'active' || mods[k].status === 'ACTIVE' || mods[k].total_evaluations !== undefined);
      return `<div class="mod"><span class="m-dot ${active ? '' : 'off'}"></span><span class="m-name">${esc(k)}</span></div>`;
    }).join('') || '<div class="empty">No module data</div>';

    await loadVolumeChart();

    document.getElementById('lastRefresh').textContent = 'updated ' + new Date().toLocaleTimeString();
  } catch (e) {
    document.getElementById('dot').style.background = 'var(--red)';
    document.getElementById('lastRefresh').textContent = 'error: ' + e.message;
  }
}

function initReportDates() {
  const to = new Date();
  const from = new Date();
  from.setDate(from.getDate() - 30);
  document.getElementById('reportTo').value = to.toISOString().slice(0, 10);
  document.getElementById('reportFrom').value = from.toISOString().slice(0, 10);
}

let reportObjectUrl = null;

async function generateReport() {
  const appSource = document.getElementById('reportAppSource').value;
  const from = document.getElementById('reportFrom').value;
  const to = document.getElementById('reportTo').value;
  try {
    const r = await fetch(`${API}/governance/reports/${appSource}?from_date=${from}&to_date=${to}`, {
      headers: { 'Authorization': 'Bearer ' + TOKEN }
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const blob = await r.blob();
    if (reportObjectUrl) URL.revokeObjectURL(reportObjectUrl);
    reportObjectUrl = URL.createObjectURL(blob);
    document.getElementById('reportViewer').src = reportObjectUrl;
    document.getElementById('reportViewerCard').style.display = 'block';
  } catch (e) {
    alert('Report generation failed: ' + e.message);
  }
}

function closeReport() {
  document.getElementById('reportViewerCard').style.display = 'none';
  document.getElementById('reportViewer').src = 'about:blank';
  if (reportObjectUrl) { URL.revokeObjectURL(reportObjectUrl); reportObjectUrl = null; }
}

async function boot() {
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  try {
    await api('/status/nodes');
  } catch (e) {
    document.getElementById('app').style.display = 'none';
    document.getElementById('gate').style.display = 'flex';
    document.getElementById('gateErr').textContent = 'Invalid token or connection failed.';
    return;
  }
  initReportDates();
  refresh();
  timer = setInterval(refresh, 30000);
}

if (TOKEN) boot();
</script>
</body>
</html>
