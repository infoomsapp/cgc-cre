<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CGC Core — Scoring</title>
<style>
  :root {
    --bg: #0b0f0e;
    --panel: #121816;
    --panel-2: #171f1c;
    --border: #253430;
    --text: #e6efe9;
    --muted: #7d9089;
    --accent: #4fd8a8;
    --accent-dim: rgba(79,216,168,0.12);
    --red: #ea8a78;
    --red-bg: rgba(234,138,120,0.12);
    --amber: #e8b454;
    --amber-bg: rgba(232,180,84,0.12);
    --green: #4ed892;
    --green-bg: rgba(78,216,146,0.12);
    --mono: ui-monospace, "SF Mono", Consolas, monospace;
    --sans: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--sans); font-size: 14px; line-height: 1.5;
  }
  #gate {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 16px; padding: 24px;
  }
  #gate .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 28px; width: 100%; max-width: 380px;
  }
  #gate h1 { font-size: 16px; margin: 0 0 4px; letter-spacing: 0.02em; }
  #gate p { color: var(--muted); font-size: 12.5px; margin: 0 0 18px; }
  #gate input {
    width: 100%; background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 6px; padding: 9px 10px; color: var(--text); font-family: var(--mono);
    font-size: 12.5px; margin-bottom: 10px;
  }
  #gate button, .btn {
    background: var(--accent); color: #04140e; border: none; border-radius: 6px;
    padding: 9px 14px; font-weight: 700; font-size: 12.5px; cursor: pointer; width: 100%;
  }
  #gate .err { color: var(--red); font-size: 12px; margin-top: 8px; min-height: 16px; }
  #app { display: none; max-width: 1160px; margin: 0 auto; padding: 28px 20px 60px; }
  header.top {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;
  }
  header.top h1 { font-size: 15px; margin: 0; letter-spacing: 0.02em; }
  header.top .sub { color: var(--muted); font-size: 11.5px; font-family: var(--mono); }
  header.top .right { display: flex; align-items: center; gap: 10px; }
  #dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); display: inline-block; }
  .logout { background: none; border: 1px solid var(--border); color: var(--muted); padding: 5px 10px; border-radius: 6px; font-size: 11px; cursor: pointer; }

  .topnav { display: flex; gap: 6px; margin-bottom: 24px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
  .topnav a {
    color: var(--muted); text-decoration: none; font-size: 12px; font-weight: 700;
    padding: 6px 12px; border-radius: 6px; letter-spacing: 0.02em;
  }
  .topnav a:hover { color: var(--text); background: var(--panel-2); }
  .topnav a.active { color: #04140e; background: var(--accent); }

  section { margin-bottom: 24px; }
  section h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 10px; }
  .empty { color: var(--muted); font-size: 12.5px; padding: 20px; text-align: center; }

  .flowCards { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px,1fr)); gap: 14px; }
  .flowCard { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; }
  .flowCard .flowHead { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
  .flowCard .flowApp { font-size: 12.5px; font-weight: 700; letter-spacing: 0.02em; }
  .flowCard .flowNum { font-family: var(--mono); font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--muted); }
  .flowCard .flowNum.good { color: var(--green); }
  .flowCard .flowNum.warn { color: var(--amber); }
  .flowCard .flowNum.bad { color: var(--red); }
  .flowSignals { display: flex; flex-direction: column; gap: 6px; }
  .flowSignal { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 11.5px; color: var(--muted); }
  .flowSignal .fsVal { font-family: var(--mono); color: var(--text); white-space: nowrap; }
  .flowSignal.info { opacity: 0.7; font-style: italic; }
  .sparkWrap { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); }
  .sparkLabel { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 4px; }
</style>
</head>
<body>

<div id="gate">
  <div class="card">
    <h1>CGC Core — Scoring</h1>
    <p>Paste your Bearer token to connect. Stored only in this browser.</p>
    <input id="keyInput" type="password" placeholder="CGC_SERVICE_API_KEY or token" autocomplete="off">
    <button onclick="connect()">Connect</button>
    <div class="err" id="gateErr"></div>
  </div>
</div>

<div id="app">
  <header class="top">
    <div>
      <h1>CGC Core — Scoring</h1>
      <div class="sub">cgc-cre.vercel.app</div>
    </div>
    <div class="right">
      <span id="dot"></span>
      <span class="sub" id="lastRefresh">—</span>
      <button class="logout" onclick="disconnect()">Disconnect</button>
    </div>
  </header>

  <nav class="topnav">
    <a href="/dashboard">Home</a>
    <a href="/dashboard/governance">Governance</a>
    <a href="/dashboard/scoring" class="active">Scoring</a>
    <a href="/dashboard/security">Security</a>
  </nav>

  <section>
    <h2>Business Flow Scoring</h2>
    <div class="flowCards" id="flowCards"></div>
  </section>
</div>

<script>
const API = window.location.origin;
let TOKEN = localStorage.getItem('cgc_dash_token') || '';
let timer = null;

function connect() {
  const v = document.getElementById('keyInput').value.trim();
  if (!v) return;
  TOKEN = v;
  localStorage.setItem('cgc_dash_token', v);
  boot();
}
function disconnect() {
  localStorage.removeItem('cgc_dash_token');
  TOKEN = '';
  if (timer) clearInterval(timer);
  document.getElementById('app').style.display = 'none';
  document.getElementById('gate').style.display = 'flex';
}

async function api(path) {
  const r = await fetch(API + path, { headers: { 'Authorization': 'Bearer ' + TOKEN } });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function fmtPct(x) {
  return (x === null || x === undefined) ? '—' : (x * 100).toFixed(1) + '%';
}

function fmtStddev(x) {
  return (x === null || x === undefined) ? 'n/a' : x.toFixed(3);
}

function scoreClass(score) {
  if (score === null || score === undefined) return '';
  if (score >= 80) return 'good';
  if (score >= 60) return 'warn';
  return 'bad';
}

// ---- Session sparkline ----
// flow_score has no stored historical series server-side (only a current-
// vs-baseline snapshot -- see FlowScoring.compute_flow_score()), so this
// accumulates each 30s poll's value in memory for as long as this tab
// stays open, rather than fabricating history that doesn't exist. Capped
// at 60 points (30 min at the existing poll interval) -- a live trend
// since the page was opened, explicitly labeled as such, not a claim of
// real historical data.
const SCORE_HISTORY = {};
const MAX_SPARK_POINTS = 60;

function pushScoreHistory(appKey, score) {
  if (score === null || score === undefined) return;
  const h = SCORE_HISTORY[appKey] || (SCORE_HISTORY[appKey] = []);
  h.push(score);
  if (h.length > MAX_SPARK_POINTS) h.shift();
}

function renderSparkline(appKey) {
  const h = SCORE_HISTORY[appKey] || [];
  if (h.length < 2) return '';
  const W = 260, H = 34, pad = 2;
  const min = Math.min(...h), max = Math.max(...h);
  const range = (max - min) || 1;
  const pts = h.map((v, i) => {
    const x = (i / (h.length - 1)) * (W - pad * 2) + pad;
    const y = H - pad - ((v - min) / range) * (H - pad * 2);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  const lastX = W - pad;
  const lastY = H - pad - ((h[h.length - 1] - min) / range) * (H - pad * 2);
  return `
    <div class="sparkWrap">
      <div class="sparkLabel">Trend since page opened (${h.length} sample${h.length === 1 ? '' : 's'})</div>
      <svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none">
        <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="1.5"/>
        <circle cx="${lastX.toFixed(1)}" cy="${lastY.toFixed(1)}" r="2.5" fill="var(--accent)"/>
      </svg>
    </div>`;
}

function renderFlowCard(appKey, appLabel, data) {
  if (!data || data.insufficient_data) {
    const have = data ? data.sample_sizes.baseline_total : 0;
    return `
      <div class="flowCard">
        <div class="flowHead"><span class="flowApp">${esc(appLabel)}</span><span class="flowNum">—</span></div>
        <div class="empty" style="padding:8px 0;">Not enough decision history yet (${esc(have)}/10 baseline decisions)</div>
      </div>`;
  }
  const s = data.signals;
  pushScoreHistory(appKey, data.flow_score);
  return `
    <div class="flowCard">
      <div class="flowHead">
        <span class="flowApp">${esc(appLabel)}</span>
        <span class="flowNum ${scoreClass(data.flow_score)}">${esc(data.flow_score)}</span>
      </div>
      <div class="flowSignals">
        <div class="flowSignal"><span>Approval rate</span><span class="fsVal">${fmtPct(s.approval_drift.current_rate)} (was ${fmtPct(s.approval_drift.baseline_rate)})</span></div>
        <div class="flowSignal"><span>Velocity</span><span class="fsVal">${esc(s.velocity_spike.current_per_day)}/day (was ${esc(s.velocity_spike.baseline_per_day)}/day)</span></div>
        <div class="flowSignal"><span>High-sensitivity share</span><span class="fsVal">${fmtPct(s.sensitivity_creep.current_rate)} (was ${fmtPct(s.sensitivity_creep.baseline_rate)})</span></div>
        <div class="flowSignal"><span>Score volatility</span><span class="fsVal">${fmtStddev(s.score_volatility.current_stddev)} (was ${fmtStddev(s.score_volatility.baseline_stddev)})</span></div>
        <div class="flowSignal info"><span>Human-review load</span><span class="fsVal">${fmtPct(s.human_review_load.current_rate)} (was ${fmtPct(s.human_review_load.baseline_rate)})</span></div>
      </div>
      ${renderSparkline(appKey)}
    </div>`;
}

async function refresh() {
  try {
    const [flowLp, flowLtp] = await Promise.all([
      api('/flow-score/ledgiproof'),
      api('/flow-score/ledgiproof-tax-pro'),
    ]);

    document.getElementById('flowCards').innerHTML =
      renderFlowCard('ledgiproof', 'LedgiProof', flowLp) +
      renderFlowCard('ledgiproof-tax-pro', 'LedgiProof Tax Pro', flowLtp);
    document.getElementById('dot').style.background = 'var(--green)';
    document.getElementById('gateErr').textContent = '';

    document.getElementById('lastRefresh').textContent = 'updated ' + new Date().toLocaleTimeString();
  } catch (e) {
    document.getElementById('dot').style.background = 'var(--red)';
    document.getElementById('lastRefresh').textContent = 'error: ' + e.message;
  }
}

async function boot() {
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  try {
    await api('/flow-score/ledgiproof');
  } catch (e) {
    document.getElementById('app').style.display = 'none';
    document.getElementById('gate').style.display = 'flex';
    document.getElementById('gateErr').textContent = 'Invalid token or connection failed.';
    return;
  }
  refresh();
  timer = setInterval(refresh, 30000);
}

if (TOKEN) boot();
</script>
</body>
</html>
